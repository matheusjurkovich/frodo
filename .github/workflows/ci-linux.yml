name: ci-linux

on:
  pull_request:
    paths:
      - 'linux/**'
      - 'shared/**'
      - '.github/workflows/ci-linux.yml'
  push:
    branches: [master]
    paths:
      - 'linux/**'
      - 'shared/**'
      - '.github/workflows/ci-linux.yml'

concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      HUSKY: '0'
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: linux/package-lock.json
      - name: Instala gjs e typelibs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gjs gir1.2-soup-3.0 libglib2.0-bin dbus-daemon zip unzip jq
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Empacota a extensão
        run: sh tools/pack.sh 0.0.0-ci
