name: ci-linux

on:
  pull_request:
    paths:
      - 'linux/**'
      - 'shared/**'
      - '.github/workflows/ci-linux.yml'
  push:
    branches: [master]
    paths:
      - 'linux/**'
      - 'shared/**'
      - '.github/workflows/ci-linux.yml'

concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      HUSKY: '0'
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: linux/package-lock.json
      - name: Instala gjs e typelibs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gjs gir1.2-soup-3.0 libglib2.0-bin
      - run: npm ci
      - run: npm run check
      - name: Testa o protocolo do hook
        working-directory: .
        run: sh shared/hooks/claude-session.test.sh
      - name: Testa o get.sh
        run: sh tools/get.test.sh
